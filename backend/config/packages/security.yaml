security:
    # La hiérarchie déclare qu'un administrateur hérite automatiquement des
    # permissions d'un utilisateur classique.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Provider principal utilisé par Symfony Security pour retrouver un
        # utilisateur à partir de son identifiant de connexion.
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Firewall technique pour les outils de développement Symfony.
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Firewall public pour la documentation API et les schémas d'erreur.
        api_docs:
            pattern: ^/api/(docs|contexts|validation_errors)
            security: false
        # Firewall de connexion : il active le mécanisme json_login de Symfony
        # puis délègue la génération du JWT au handler Lexik.
        login:
            pattern: ^/api/login$
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        # Firewall de rafraîchissement : il ne vérifie pas un JWT d'accès, mais
        # laisse Gesdinet relire le refresh token envoyé par cookie.
        token_refresh:
            pattern: ^/api/token/refresh$
            stateless: true
            provider: app_user_provider
            refresh_jwt:
                check_path: /api/token/refresh
        # Firewall principal de l'API : toute route /api protégée passe ici et
        # attend un Bearer token JWT valide.
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    # Les règles sont lues de haut en bas : la première qui matche gagne.
    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh$, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/invalidate$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/contexts, roles: PUBLIC_ACCESS }
        - { path: ^/api/movies, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/genres, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/actors, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/directors, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # En test, on réduit volontairement le coût du hash pour accélérer
            # l'exécution sans changer le comportement fonctionnel.
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
