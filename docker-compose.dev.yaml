services:
  mysql:
    image: mysql:8.0.44
    container_name: netflux_mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: netflux
      MYSQL_USER: netflux
      MYSQL_PASSWORD: netflux
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - netflux_network
    command: >
      --default-authentication-plugin=mysql_native_password
      --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unetflux", "-pnetflux"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: netflux_backend_dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://netflux:netflux@mysql:3306/netflux?serverVersion=8.0.44&charset=utf8mb4
      APP_ENV: dev
      APP_DEBUG: 1
      XDEBUG_MODE: off
      CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
      JWT_SECRET_KEY: /app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/config/jwt/public.pem
      JWT_PASSPHRASE: 89e0293822f21dd492e64a721644543191d0d78ddaa13e37f605d7f79000ae61
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_var:/app/var
    networks:
      - netflux_network

  nginx_backend:
    image: nginx:alpine
    container_name: netflux_nginx_backend_dev
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - netflux_network

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: netflux_frontend_dev
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://nginx_backend
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - netflux_network

volumes:
  mysql_dev_data:
  backend_vendor:
  backend_var:
  frontend_node_modules:

networks:
  netflux_network:
    driver: bridge
