services:
  mysql_test:
    image: mysql:8.0.44
    container_name: netflux_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    networks:
      - netflux_test_network
    command: >
      --default-authentication-plugin=mysql_native_password
      --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: netflux_backend_test
    depends_on:
      mysql_test:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:root@mysql_test:3306/netflux?serverVersion=8.0.44&charset=utf8mb4
      APP_ENV: test
      APP_DEBUG: 1
      XDEBUG_MODE: off
      CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
      JWT_SECRET_KEY: /app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/config/jwt/public.pem
      JWT_PASSPHRASE: 89e0293822f21dd492e64a721644543191d0d78ddaa13e37f605d7f79000ae61
    volumes:
      - ./backend:/app
      - backend_test_vendor:/app/vendor
      - backend_test_var:/app/var
    networks:
      - netflux_test_network
    command: >
      sh -c "
      composer install --no-interaction --no-scripts &&
      sleep 15 &&
      php bin/console doctrine:database:create --if-not-exists --no-interaction &&
      php bin/console doctrine:migrations:migrate --no-interaction &&
      php bin/console doctrine:fixtures:load --no-interaction &&
      php-fpm
      "

  nginx_backend:
    image: nginx:alpine
    container_name: netflux_nginx_backend_test
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - netflux_test_network

  frontend_test:
    build:
      context: ./frontend
      target: dev
    container_name: netflux_frontend_test
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://nginx_backend
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_test_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - netflux_test_network

  playwright:
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    container_name: netflux_playwright
    depends_on:
      - backend
      - frontend_test
      - nginx_backend
    environment:
      CI: "true"
    volumes:
      - ./frontend:/app
    working_dir: /app
    network_mode: "host"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        npm install
        sleep 15
        tail -f /dev/null

volumes:
  backend_test_vendor:
  backend_test_var:
  frontend_test_node_modules:

networks:
  netflux_test_network:
    driver: bridge
