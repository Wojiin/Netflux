services:
  mysql:
    image: mysql:8.0.44
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_secure}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-netflux}
      MYSQL_USER: ${MYSQL_USER:-netflux}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-netflux_password_secure}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - netflux_network
    command: >
      --default-authentication-plugin=mysql_native_password
      --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-netflux}", "-p${MYSQL_PASSWORD:-netflux_password_secure}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://netflux:netflux_password_secure@mysql:3306/netflux?serverVersion=8.0.44&charset=utf8mb4}
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-change_me_in_production}
      CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
      JWT_SECRET_KEY: /app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/config/jwt/public.pem
      JWT_PASSPHRASE: 89e0293822f21dd492e64a721644543191d0d78ddaa13e37f605d7f79000ae61
    volumes:
      - backend_var_prod:/app/var
    networks:
      - netflux_network

  nginx_backend:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - netflux_network

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - netflux_network

volumes:
  mysql_data:
  backend_var_prod:

networks:
  netflux_network:
    driver: bridge
